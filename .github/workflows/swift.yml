name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIN_SWIFT_VERSION: "6.0"
  MIN_XCODE_VERSION: "16.2"

jobs:
  linux-test:
    runs-on: ubuntu-latest
    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: |
          swift --version
          actual=$(swift --version | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_SWIFT_VERSION%%.*}; min_minor=${MIN_SWIFT_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Swift $actual satisfies minimum $MIN_SWIFT_VERSION"
          else
            echo "::error::Swift $actual is below the minimum supported $MIN_SWIFT_VERSION"
            exit 1
          fi
      - name: Build
        run: make build
      - name: Test with coverage gate (>= 80%)
        # Runs the full suite (AsposeBarcodeCloudUnitTests + live AsposeBarcodeCloudIntegrationTests targets) once,
        # under coverage instrumentation, and enforces the gate. This is the
        # single Linux test run; other platforms run the offline unit tests via
        # `make test`.
        run: make cover
      - name: Run example
        run: make example
      - name: Run snippets
        run: make snippets-test

  macos-test:
    runs-on: macos-latest
    needs: linux-test
    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          actual=$(xcodebuild -version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_XCODE_VERSION%%.*}; min_minor=${MIN_XCODE_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Xcode $actual satisfies minimum $MIN_XCODE_VERSION"
          else
            echo "::error::Xcode $actual is below the minimum supported $MIN_XCODE_VERSION"
            exit 1
          fi
      - name: Verify Swift version
        run: |
          swift --version
          actual=$(swift --version | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_SWIFT_VERSION%%.*}; min_minor=${MIN_SWIFT_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Swift $actual satisfies minimum $MIN_SWIFT_VERSION"
          else
            echo "::error::Swift $actual is below the minimum supported $MIN_SWIFT_VERSION"
            exit 1
          fi
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Run example
        run: make example

  apple-platform-build:
    runs-on: macos-latest
    needs: linux-test
    strategy:
      fail-fast: false
      matrix:
        destination:
          - "generic/platform=iOS Simulator"
          - "generic/platform=tvOS Simulator"
          - "generic/platform=watchOS Simulator"
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          actual=$(xcodebuild -version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_XCODE_VERSION%%.*}; min_minor=${MIN_XCODE_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Xcode $actual satisfies minimum $MIN_XCODE_VERSION"
          else
            echo "::error::Xcode $actual is below the minimum supported $MIN_XCODE_VERSION"
            exit 1
          fi
      # Compile the SDK against each Apple platform's SDK so the Swift compiler's
      # availability checker enforces the deployment-target floor in Package.swift
      # (iOS 15 / tvOS 15 / watchOS 8). Using an API newer than the floor fails
      # the build here. macOS is already compiled by `swift build` in macos-test.
      - name: Build for ${{ matrix.destination }}
        run: ./Scripts/buildApplePlatforms.sh "${{ matrix.destination }}"
