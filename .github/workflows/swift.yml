name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIN_SWIFT_VERSION: "6.0"
  MIN_XCODE_VERSION: "16.2"

permissions:
  contents: read

jobs:
  linux-test:
    # ubuntu-latest is ubuntu-26.04 now, which ships no Swift toolchain
    runs-on: ubuntu-24.04
    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
      TEST_CONFIGURATION_BARCODE_IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/testdata/QR_and_Code128.png
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: |
          swift --version
          actual=$(swift --version | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_SWIFT_VERSION%%.*}; min_minor=${MIN_SWIFT_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Swift $actual satisfies minimum $MIN_SWIFT_VERSION"
          else
            echo "::error::Swift $actual is below the minimum supported $MIN_SWIFT_VERSION"
            exit 1
          fi
      - name: Build
        run: make build
      - name: Test with coverage gate (>= 80%)
        # Runs the full suite (AsposeBarcodeCloudUnitTests + live AsposeBarcodeCloudIntegrationTests targets) once,
        # under coverage instrumentation, and enforces the gate. This is the
        # single Linux test run; other platforms run the offline unit tests via
        # `make test`.
        run: make cover
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-badge.json
            coverage/coverage-summary.json
            coverage/lcov.info
      - name: Run example
        run: make example
      - name: Run snippets
        run: make snippets-test

  macos-test:
    runs-on: macos-latest
    needs: linux-test
    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          actual=$(xcodebuild -version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_XCODE_VERSION%%.*}; min_minor=${MIN_XCODE_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Xcode $actual satisfies minimum $MIN_XCODE_VERSION"
          else
            echo "::error::Xcode $actual is below the minimum supported $MIN_XCODE_VERSION"
            exit 1
          fi
      - name: Verify Swift version
        run: |
          swift --version
          actual=$(swift --version | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_SWIFT_VERSION%%.*}; min_minor=${MIN_SWIFT_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Swift $actual satisfies minimum $MIN_SWIFT_VERSION"
          else
            echo "::error::Swift $actual is below the minimum supported $MIN_SWIFT_VERSION"
            exit 1
          fi
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Run example
        run: make example

  apple-platform-build:
    runs-on: macos-latest
    needs: linux-test
    strategy:
      fail-fast: false
      matrix:
        # tvOS and watchOS builds are not run in CI; build them locally with
        # `make build-apple` when needed.
        destination:
          - "generic/platform=iOS Simulator"
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          actual=$(xcodebuild -version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          actual_major=${actual%%.*}; actual_minor=${actual#*.}
          min_major=${MIN_XCODE_VERSION%%.*}; min_minor=${MIN_XCODE_VERSION#*.}
          if [ "$actual_major" -gt "$min_major" ] || { [ "$actual_major" -eq "$min_major" ] && [ "$actual_minor" -ge "$min_minor" ]; }; then
            echo "Xcode $actual satisfies minimum $MIN_XCODE_VERSION"
          else
            echo "::error::Xcode $actual is below the minimum supported $MIN_XCODE_VERSION"
            exit 1
          fi
      # Compile the SDK against the iOS SDK so the Swift compiler's availability
      # checker enforces the deployment-target floor in Package.swift (iOS 15).
      # Using an API newer than the floor fails the build here. macOS is already
      # compiled by `swift build` in macos-test.
      - name: Build for ${{ matrix.destination }}
        run: ./Scripts/buildApplePlatforms.sh "${{ matrix.destination }}"

  publish-coverage:
    name: Publish coverage
    needs: linux-test
    # Only pushes to the default branch publish, and only once the GitHub App for
    # the test-coverage repository is configured (COVERAGE_APP_CLIENT_ID variable).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COVERAGE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: Get a token for the test-coverage repository
        id: coverage-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.COVERAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          owner: aspose-barcode-cloud
          repositories: test-coverage
          permission-contents: write
      - name: Publish to test-coverage
        run: python Scripts/publish-coverage.py swift
        env:
          COVERAGE_TOKEN: ${{ steps.coverage-token.outputs.token }}
          COVERAGE_APP_SLUG: ${{ steps.coverage-token.outputs.app-slug }}
