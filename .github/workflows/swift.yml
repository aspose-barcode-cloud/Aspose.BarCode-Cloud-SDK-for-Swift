name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ALLOWED_SWIFT_VERSIONS: "6.0 6.1"
  ALLOWED_XCODE_VERSIONS: "16.2 16.3"
  IOS_DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"

jobs:
  linux-test:
    runs-on: ubuntu-latest
    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: |
          swift --version
          actual=$(swift --version | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          allowed=(${ALLOWED_SWIFT_VERSIONS})
          for v in "${allowed[@]}"; do
            [ "$actual" = "$v" ] && { echo "Swift $actual is allowed"; exit 0; }
          done
          echo "::error::Swift $actual not in allowed set: ${allowed[*]}"
          exit 1
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Run example
        run: make example

  macos-test:
    runs-on: macos-latest
    needs: linux-test
    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          actual=$(xcodebuild -version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          allowed=(${ALLOWED_XCODE_VERSIONS})
          for v in "${allowed[@]}"; do
            [ "$actual" = "$v" ] && { echo "Xcode $actual is allowed"; exit 0; }
          done
          echo "::error::Xcode $actual not in allowed set: ${allowed[*]}"
          exit 1
      - name: Verify Swift version
        run: |
          actual=$(swift --version | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          allowed=(${ALLOWED_SWIFT_VERSIONS})
          for v in "${allowed[@]}"; do
            [ "$actual" = "$v" ] && exit 0
          done
          echo "::error::Swift $actual not in allowed set: ${allowed[*]}"
          exit 1
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Run example
        run: make example

  ios-test:
    runs-on: macos-latest
    needs: linux-test
    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          actual=$(xcodebuild -version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          allowed=(${ALLOWED_XCODE_VERSIONS})
          for v in "${allowed[@]}"; do
            [ "$actual" = "$v" ] && exit 0
          done
          echo "::error::Xcode $actual not in allowed set: ${allowed[*]}"
          exit 1
      - name: Build
        run: xcodebuild build -scheme AsposeBarcodeCloud -destination "$IOS_DESTINATION"
      - name: Test
        run: xcodebuild test -scheme AsposeBarcodeCloud -destination "$IOS_DESTINATION"
